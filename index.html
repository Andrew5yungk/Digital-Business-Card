<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrew Yungk - Yungk Technologies</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Original Ambient Glowing Background Elements Layer -->
    <div class="ambient-layer">
        <div class="node node-1"></div>
        <div class="node node-2"></div>
        <div class="node node-3"></div>
    </div>

    <!-- Main Central Layout Glass Card Block -->
    <main>
        <div class="card-body">
            
            <!-- Branding Segment -->
            <div class="brand-header">
                <div class="logo-box">
                    <img src="logo.jpg" alt="Yungk Technologies Logo">
                </div>
                <h1>YUNGK TECHNOLOGIES</h1>
                <div class="subtitle">Full Stack Developer</div>
                <div class="author">
                    <span>👤</span> Andrew Yungk
                </div>
            </div>

            <!-- Profile Interactive Call Controls -->
            <div class="button-grid">
                <button onclick="saveContact()" class="btn-primary">Save Contact</button>
                <button onclick="shareCard()" class="btn-secondary">Share Card</button>
            </div>

            <div class="tech-section">
                <div class="section-title">Tech Expertise</div>
                <div class="badge-container">
                    <span class="badge"><span class="dot dot-react"></span> React Native</span>
                    <span class="badge"><span class="dot dot-supabase"></span> Supabase</span>
                    <span class="badge"><span class="dot dot-expo"></span> Expo</span>
                </div>
            </div>

            <div class="links-section">
                <div class="section-title">Contact Hub</div>
                
                <a href="tel:2102609483" class="contact-row">
                    <div class="row-layout">
                        <div class="icon-wrap">CALL</div>
                        <div class="link-text">
                            <span class="label">Phone</span>
                            <span class="value">(210) 260-9483</span>
                        </div>
                    </div>
                    <span class="chevron">➔</span>
                </a>

                <a href="mailto:yungktechnologies@gmail.com" class="contact-row">
                    <div class="row-layout">
                        <div class="icon-wrap">MAIL</div>
                        <div class="link-text">
                            <span class="label">Email</span>
                            <span class="value">yungktechnologies@gmail.com</span>
                        </div>
                    </div>
                    <span class="chevron">➔</span>
                </a>

                <a href="https://linkedin.com/in/andrew5yungk" target="_blank" class="contact-row">
                    <div class="row-layout">
                        <div class="icon-wrap">LINK</div>
                        <div class="link-text">
                            <span class="label">LinkedIn</span>
                            <span class="value">in/andrew5yungk</span>
                        </div>
                    </div>
                    <span class="chevron">➔</span>
                </a>

                <a href="https://github.com/andrew5yungk" target="_blank" class="contact-row">
                    <div class="row-layout">
                        <div class="icon-wrap">CODE</div>
                        <div class="link-text">
                            <span class="label">GitHub</span>
                            <span class="value">github.com/andrew5yungk</span>
                        </div>
                    </div>
                    <span class="chevron">➔</span>
                </a>
            </div>

        </div>
    </main>

    <footer>
        &copy; 2026 Yungk Technologies. All rights reserved.
    </footer>

    <script src="script.js"></script>
</body>
</html>
